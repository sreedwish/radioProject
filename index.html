<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/radioProject/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Orvibe is a live radio player. Tune FM and AM stations on a retro dial and listen free in your browser. Feel the frequency.">

  <!-- Link previews (WhatsApp, Facebook, LinkedIn, iMessage, Slack) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Orvibe">
  <meta property="og:title" content="Orvibe – Live Radio">
  <meta property="og:description" content="Tune FM and AM stations on a retro dial and listen free in your browser. Feel the frequency.">
  <meta property="og:url" content="https://sreedwish.github.io/radioProject/">
  <meta property="og:image" content="https://sreedwish.github.io/radioProject/icons/Icon-512.png">

  <!-- X / Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Orvibe – Live Radio">
  <meta name="twitter:description" content="Tune FM and AM stations on a retro dial and listen free in your browser.">
  <meta name="twitter:image" content="https://sreedwish.github.io/radioProject/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Orvibe">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="icon" href="favicon.ico" sizes="any"/>

  <title>Orvibe – Live Radio</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background:#0b0b1a url(splash_bg.png) center/cover no-repeat;">
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
