<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/radioProject/orvibeFM/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Orvibe is a live radio player. Tune FM and AM stations on a retro dial and listen free in your browser. Feel the frequency.">

  <!-- Link previews (WhatsApp, Facebook, LinkedIn, iMessage, Slack) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Orvibe">
  <meta property="og:title" content="Orvibe – Live Radio">
  <meta property="og:description" content="Tune FM and AM stations on a retro dial and listen free in your browser. Feel the frequency.">
  <meta property="og:url" content="https://sreedwish.github.io/radioProject/orvibeFM/">
  <meta property="og:image" content="https://sreedwish.github.io/radioProject/orvibeFM/icons/Icon-512.png">

  <!-- X / Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Orvibe – Live Radio">
  <meta name="twitter:description" content="Tune FM and AM stations on a retro dial and listen free in your browser.">
  <meta name="twitter:image" content="https://sreedwish.github.io/radioProject/orvibeFM/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Orvibe">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="icon" href="favicon.ico" sizes="any"/>

  <title>Orvibe – Live Radio</title>
  <meta name="theme-color" content="#0B0A0F">
  <link rel="manifest" href="manifest.json">
</head>
<body style="background:#0b0b1a url(splash_bg.png) center/cover no-repeat;">
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="install-banner" hidden style="position:fixed;left:12px;right:12px;bottom:12px;z-index:10;max-width:420px;margin:0 auto;padding:12px 14px;border-radius:16px;background:#1a1226;color:#fff;font:14px/1.35 system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.5);border:1px solid rgba(224,64,251,.4);align-items:center;gap:12px">
    <img src="icons/Icon-192.png" alt="" width="40" height="40" style="border-radius:10px">
    <div style="flex:1"><b>Install Orvibe</b><br><span id="install-text">Add it to your home screen for quick access.</span></div>
    <button id="install-yes" style="background:#9c27b0;color:#fff;border:0;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer">Install</button>
    <button id="install-no" aria-label="Dismiss" style="background:none;color:#fff;border:0;font-size:20px;cursor:pointer">&times;</button>
  </div>
  <script>
    (function () {
      var banner = document.getElementById('install-banner');
      var yes = document.getElementById('install-yes');
      var text = document.getElementById('install-text');
      var key = 'orvibe-install-dismissed';
      function dismissed() { try { return localStorage.getItem(key); } catch (e) { return null; } }
      function show() { if (!dismissed()) banner.hidden = false, banner.style.display = 'flex'; }
      function hide() { banner.hidden = true; banner.style.display = 'none'; try { localStorage.setItem(key, '1'); } catch (e) {} }
      document.getElementById('install-no').onclick = hide;
      var standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
      if (standalone) return;
      var deferred;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault(); deferred = e; setTimeout(show, 2500);
      });
      yes.onclick = function () {
        if (!deferred) return hide();
        deferred.prompt();
        deferred.userChoice.then(hide);
        deferred = null;
      };
      window.addEventListener('appinstalled', hide);
      // iOS Safari has no install prompt, so explain the manual steps.
      var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (ios) {
        text.textContent = 'Tap Share, then scroll to "Add to Home Screen".';
        yes.textContent = 'Share';
        // Safari can't start an install, but it can open the share sheet,
        // which has "Add to Home Screen".
        yes.onclick = function () {
          if (navigator.share) {
            navigator.share({ title: 'Orvibe', url: location.href }).catch(function () {});
          }
        };
        setTimeout(show, 2500);
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
